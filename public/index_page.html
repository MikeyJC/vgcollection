<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="public/css/style.css">
    <title>The Video Game Collection</title>
    <script>
        function loadContent() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "api/v1/index.php/videogames/list", true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    document.getElementById("content").innerHTML = xhr.responseText;
                }
            };
            xhr.send();
        }
    </script>
</head>
<body>
    <h1>The Video Game Collection</h1>
    <p>
        <button onclick="loadContent()">Load Video Games</button>
        <div id="content"></div>
    </p>
</body>
</html>
